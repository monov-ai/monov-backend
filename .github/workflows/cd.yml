name: CD

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

env:
  IMAGE_NAME: monov-ai

jobs:
  # ---------- 1) 이미지 빌드 + Docker Hub push ----------
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant gradlew exec
        run: chmod +x gradlew

      # GitHub Secrets 의 APPLICATION 한 개에 application.yml 전체를 그대로 저장.
      # 빌드 직전에 이걸 src/main/resources/application.yml 로 풀어 → bootJar 가 이미지 안에 박음.
      - name: application.yml 생성
        run: |
          mkdir -p src/main/resources
          cat > src/main/resources/application.yml <<'__APP_YML_END__'
          ${{ secrets.APPLICATION }}
          __APP_YML_END__

      - name: Build (skip tests)
        run: ./gradlew bootJar -x test --no-daemon

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  # ---------- 2) EC2 배포 (이미지 pull + blue-green 전환) ----------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Run deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            export DOCKERHUB_USERNAME='${{ secrets.DOCKERHUB_USERNAME }}'
            export IMAGE_TAG='${{ github.sha }}'
            export GRAFANA_PASSWORD='${{ secrets.GRAFANA_PASSWORD }}'
            cd ~/monov-backend
            ./deploy/deploy.sh
