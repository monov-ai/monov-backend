name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: ['**', '!develop']    # develop 은 cd.yml 에서 빌드 — 중복 회피
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant gradlew exec
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew compileJava --no-daemon

      - name: Build bootJar (검증)
        run: ./gradlew bootJar --no-daemon -x test

      - name: Upload jar artifact (필요 시 디버깅)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootjar-failed
          path: build/libs/*.jar
          retention-days: 3