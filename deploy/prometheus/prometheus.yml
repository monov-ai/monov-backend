global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'monov-app'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'app-blue:8080'
          - 'app-green:8080'
        labels:
          service: monov-ai
    # 비활성 색깔은 down 으로 표시 — 이는 정상 동작
    relabel_configs:
      - source_labels: [__address__]
        regex: 'app-(blue|green):.*'
        target_label: color
        replacement: '$1'