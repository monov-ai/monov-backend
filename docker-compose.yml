# EC2 위에서 실행. nginx + certbot 은 호스트에 별도 운영.
# 시크릿: 빌드 시점에 이미지 안에 application.yml 로 박혀있음 (cd.yml 이 APPLICATION secret → src/main/resources/application.yml).
# 컨테이너에 외부 yml 마운트나 env 주입 없음.
#
# 사용:
#   docker compose up -d redis prometheus grafana    # 인프라 먼저
#   docker compose up -d app-blue                    # 첫 배포
#   ./deploy/deploy.sh                                # 이후 blue↔green 자동 전환

x-app-common: &app-common
  image: ${DOCKERHUB_USERNAME}/monov-ai:${IMAGE_TAG:-latest}
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_started
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 5s
    retries: 8
    start_period: 60s
  networks: [monov]

services:
  app-blue:
    <<: *app-common
    container_name: monov-app-blue
    ports:
      - "127.0.0.1:8080:8080"

  app-green:
    <<: *app-common
    container_name: monov-app-green
    ports:
      - "127.0.0.1:8081:8080"

  redis:
    image: redis:7-alpine
    container_name: monov-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks: [monov]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: monov-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks: [monov]
    expose: ["9090"]

  grafana:
    image: grafana/grafana:latest
    container_name: monov-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    networks: [monov]
    depends_on:
      - prometheus

volumes:
  redis-data:
  prom-data:
  grafana-data:

networks:
  monov:
    driver: bridge